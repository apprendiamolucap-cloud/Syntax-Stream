<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNTAX SANTOS - Web Movies</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #d87093;
            --accent-hover: #c55b7f;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            color: var(--accent-color);
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .brand-text h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-primary);
            text-transform: uppercase;
        }

        .brand-text p {
            font-size: 0.75rem;
            color: var(--accent-color);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .drive-banner {
            background-color: rgba(216, 112, 147, 0.1);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 0.8rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .drive-banner a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .drive-banner a:hover {
            text-decoration: underline;
        }

        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--accent-color);
            padding-left: 0.75rem;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .movie-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .movie-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
        }

        .movie-thumbnail {
            width: 100%;
            height: 180px;
            background-color: #282828;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 3rem;
            position: relative;
        }

        .movie-info {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .movie-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .movie-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .actions {
            margin-top: auto;
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            flex: 1;
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.2s ease;
            display: inline-block;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--accent-color);
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-icon">&lt;S&gt;</div>
            <div class="brand-text">
                <h1>Syntax Santos</h1>
                <p>Web Development</p>
            </div>
        </div>

        <div class="drive-banner">
            📁 <a href="https://drive.google.com/drive/folders/1YdOmYon_WKP4ui1eIoAT-vtn5f82wdgl?usp=sharing" target="_blank">Apri Cartella Drive Completa</a>
        </div>
    </header>

    <main>
        <h2 class="section-title">Film Disponibili</h2>

        <div class="movies-grid">
            <!-- SCHEDA FILM 1 -->
            <div class="movie-card">
                <div class="movie-thumbnail">🎬</div>
                <div class="movie-info">
                    <h3 class="movie-title">Film 1 (Google Drive)</h3>
                    <p class="movie-meta">MP4 • HD</p>
                    <div class="actions">
                        <a href="https://drive.google.com/drive/folders/1YdOmYon_WKP4ui1eIoAT-vtn5f82wdgl?usp=sharing" target="_blank" class="btn btn-primary">Guarda Ora</a>
                        <a href="https://drive.google.com/drive/folders/1YdOmYon_WKP4ui1eIoAT-vtn5f82wdgl?usp=sharing" target="_blank" class="btn btn-secondary">Scarica</a>
                    </div>
                </div>
            </div>

            <!-- SCHEDA FILM 2 (Per aggiungere altri film in futuro) -->
            <div class="movie-card">
                <div class="movie-thumbnail">🎬</div>
                <div class="movie-info">
                    <h3 class="movie-title">Film 2</h3>
                    <p class="movie-meta">MP4 • HD</p>
                    <div class="actions">
                        <a href="https://drive.google.com/drive/folders/1YdOmYon_WKP4ui1eIoAT-vtn5f82wdgl?usp=sharing" target="_blank" class="btn btn-primary">Guarda Ora</a>
                        <a href="https://drive.google.com/drive/folders/1YdOmYon_WKP4ui1eIoAT-vtn5f82wdgl?usp=sharing" target="_blank" class="btn btn-secondary">Scarica</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 SYNTAX SANTOS WEB DEVELOPMENT. All rights reserved.</p>
    </footer>

</body>
</html>
